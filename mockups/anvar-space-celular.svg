<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1360" role="img" aria-labelledby="title description">
<title id="title">Anvar Space · celular</title>
<desc id="description">Propuesta conceptual de mockup móvil para Anvar Space, con navegación compacta, mensaje principal y una ilustración de planeta.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b1b"/><stop offset=".6" stop-color="#10142c"/><stop offset="1" stop-color="#17102d"/></linearGradient>
  <radialGradient id="planet" cx=".32" cy=".28" r=".8"><stop stop-color="#b4eeff"/><stop offset=".35" stop-color="#7486eb"/><stop offset=".72" stop-color="#414493"/><stop offset="1" stop-color="#191a49"/></radialGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#a3f5e7"/><stop offset="1" stop-color="#9b9cff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="14" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="390" height="1360" fill="#080a16"/><rect x="14" y="14" width="362" height="1208" rx="24" fill="url(#bg)" stroke="#30334f"/>
<g fill="#d9e7ff" opacity=".72"><circle cx="43" cy="167" r="1.2"/><circle cx="327" cy="148" r="1.4"/><circle cx="77" cy="516" r="1.3"/><circle cx="324" cy="593" r="1.1"/><circle cx="55" cy="789" r="1.4"/><circle cx="341" cy="856" r="1.2"/></g>
<text x="34" y="57" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing="1.5" fill="#f5f6ff">ANVAR <tspan fill="#9ea6ff">SPACE</tspan></text><text x="35" y="73" font-family="Arial,sans-serif" font-size="6.5" font-weight="700" letter-spacing="1.7" fill="#8b91b2">EXPLORA · IMAGINA · DESCUBRE</text><rect x="315" y="35" width="38" height="34" rx="17" fill="none" stroke="#7279bd"/><path d="M326 47h16M326 53h16M326 59h16" stroke="#f3f4ff" stroke-width="1.5"/>
<line x1="28" y1="93" x2="362" y2="93" stroke="#31344f"/><text x="34" y="134" font-family="Arial,sans-serif" font-size="8" font-weight="800" letter-spacing="1.2" fill="#a5f1e5">✦ UN UNIVERSO POR EXPLORAR</text>
<text x="31" y="214" font-family="Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="-2.8" fill="#f4f5ff">Más allá de</text><text x="31" y="265" font-family="Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="-2.8" fill="#a7adff">lo conocido.</text>
<text x="34" y="304" font-family="Arial,sans-serif" font-size="11" fill="#bec2dc">Una experiencia visual para mirar el espacio</text><text x="34" y="322" font-family="Arial,sans-serif" font-size="11" fill="#bec2dc">con curiosidad y descubrir nuevos horizontes.</text>
<rect x="32" y="350" width="204" height="43" rx="21" fill="url(#accent)"/><text x="134" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="900" letter-spacing=".4" fill="#10142b">INICIAR EXPLORACIÓN</text>
<circle cx="190" cy="628" r="171" fill="#6375ed" opacity=".13" filter="url(#glow)"/><circle cx="190" cy="626" r="126" fill="url(#planet)"/><path d="M84 596c38-26 118-42 210-4" fill="none" stroke="#c4eeff" stroke-width="2" opacity=".35"/><path d="M82 652c70 39 159 50 221 13" fill="none" stroke="#25275e" stroke-width="16" opacity=".35"/><ellipse cx="190" cy="632" rx="174" ry="52" fill="none" stroke="#b2b8ff" stroke-width="2" opacity=".75" transform="rotate(-18 190 632)"/><ellipse cx="190" cy="632" rx="188" ry="63" fill="none" stroke="#96f0e4" stroke-width="1" opacity=".38" transform="rotate(-18 190 632)"/>
<circle cx="298" cy="500" r="28" fill="#dfa5a0"/><path d="M276 497c10-6 20-9 32-6M281 510c9 4 17 4 27 0" fill="none" stroke="#ffe9ce" opacity=".45" stroke-width="2"/><circle cx="78" cy="706" r="7" fill="#a5f1e5"/><circle cx="78" cy="706" r="15" fill="none" stroke="#a5f1e5" opacity=".4"/>
<text x="34" y="818" font-family="Arial,sans-serif" font-size="8" font-weight="800" letter-spacing="1.3" fill="#abb1d2">SEÑAL 01 <tspan fill="#a5f1e5">●</tspan> EXPLORACIÓN ACTIVA</text><line x1="34" y1="841" x2="356" y2="841" stroke="#343753"/>
<text x="34" y="888" font-family="Arial,sans-serif" font-size="8" font-weight="800" letter-spacing="1.3" fill="#8c93b7">01 / EXPLORAR</text><text x="34" y="918" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f2f3ff">Nuevos horizontes</text><text x="34" y="941" font-family="Arial,sans-serif" font-size="10" fill="#aeb3d0">Déjate llevar por la curiosidad.</text><line x1="34" y1="968" x2="356" y2="968" stroke="#343753"/>
<text x="34" y="1008" font-family="Arial,sans-serif" font-size="8" font-weight="800" letter-spacing="1.3" fill="#8c93b7">02 / IMAGINAR</text><text x="34" y="1038" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f2f3ff">Un espacio para soñar</text><text x="34" y="1061" font-family="Arial,sans-serif" font-size="10" fill="#aeb3d0">Ideas que miran hacia arriba.</text>
<rect y="1240" width="390" height="120" fill="#111426"/><text x="20" y="1271" font-family="Arial,sans-serif" font-size="9" font-weight="900" letter-spacing="1.2" fill="#a5f1e5">MOCKUP · CELULAR</text><text x="20" y="1297" font-family="Arial,sans-serif" font-size="10" fill="#b4b9d5">Propuesta conceptual adaptable con navegación</text><text x="20" y="1317" font-family="Arial,sans-serif" font-size="10" fill="#b4b9d5">compacta, mensaje principal y planeta ilustrado.</text>
