<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" role="img" aria-labelledby="title description">
<title id="title">Anvar Space · computador</title>
<desc id="description">Propuesta conceptual de mockup para Anvar Space en escritorio: interfaz espacial oscura, navegación, llamado principal y composición de planetas.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b1b"/><stop offset=".58" stop-color="#10142c"/><stop offset="1" stop-color="#17102d"/></linearGradient>
  <radialGradient id="planet" cx=".32" cy=".28" r=".8"><stop stop-color="#a4e8ff"/><stop offset=".35" stop-color="#6477df"/><stop offset=".72" stop-color="#3b3c91"/><stop offset="1" stop-color="#191a49"/></radialGradient>
  <radialGradient id="moon" cx=".3" cy=".25"><stop stop-color="#ffe0b4"/><stop offset="1" stop-color="#a76569"/></radialGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#a3f5e7"/><stop offset="1" stop-color="#9b9cff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1440" height="1080" fill="#080a16"/><rect x="44" y="24" width="1352" height="930" rx="22" fill="url(#bg)" stroke="#30334f"/>
