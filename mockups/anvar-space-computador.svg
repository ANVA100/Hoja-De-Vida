<text x="785" y="708" font-family="Arial,sans-serif" font-size="9" font-weight="800" letter-spacing="1.6" fill="#abb1d2">SEÑAL 01 <tspan fill="#a5f1e5">●</tspan> EXPLORACIÓN ACTIVA</text><text x="1236" y="640" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#abb1d2">∞ / 01</text>
<rect x="44" y="754" width="1352" height="1" fill="#343753"/><text x="102" y="814" font-family="Arial,sans-serif" font-size="9" font-weight="800" letter-spacing="1.6" fill="#8c93b7">01 / EXPLORAR</text><text x="102" y="852" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f2f3ff">Nuevos horizontes</text><text x="103" y="878" font-family="Arial,sans-serif" font-size="11" fill="#aeb3d0">Déjate llevar por la curiosidad.</text>
<line x1="499" y1="790" x2="499" y2="908" stroke="#343753"/><text x="550" y="814" font-family="Arial,sans-serif" font-size="9" font-weight="800" letter-spacing="1.6" fill="#8c93b7">02 / IMAGINAR</text><text x="550" y="852" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f2f3ff">Un espacio para soñar</text><text x="551" y="878" font-family="Arial,sans-serif" font-size="11" fill="#aeb3d0">Ideas que miran hacia arriba.</text>
<line x1="947" y1="790" x2="947" y2="908" stroke="#343753"/><text x="998" y="814" font-family="Arial,sans-serif" font-size="9" font-weight="800" letter-spacing="1.6" fill="#8c93b7">03 / DESCUBRIR</text><text x="998" y="852" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f2f3ff">Sigue la aventura</text><text x="999" y="878" font-family="Arial,sans-serif" font-size="11" fill="#aeb3d0">Cada mirada abre una posibilidad.</text>
<rect y="976" width="1440" height="104" fill="#111426"/><text x="64" y="1009" font-family="Arial,sans-serif" font-size="10" font-weight="900" letter-spacing="1.3" fill="#a5f1e5">MOCKUP · COMPUTADOR</text><text x="64" y="1037" font-family="Arial,sans-serif" font-size="11" fill="#b4b9d5">Propuesta conceptual para Anvar Space: identidad cósmica, navegación y composición adaptable.</text>
</svg>
