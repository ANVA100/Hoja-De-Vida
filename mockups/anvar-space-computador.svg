<text x="93" y="78" font-family="Arial,sans-serif" font-size="19" font-weight="900" letter-spacing="3" fill="#f5f6ff">ANVAR <tspan fill="#9ea6ff">SPACE</tspan></text><text x="94" y="99" font-family="Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="2.8" fill="#8b91b2">EXPLORA · IMAGINA · DESCUBRE</text>
<text x="712" y="81" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#c5c9df">INICIO</text><text x="802" y="81" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#c5c9df">EXPLORAR</text><text x="908" y="81" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#c5c9df">GALERÍA</text><text x="1000" y="81" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#c5c9df">CONTACTO</text>
<rect x="1167" y="49" width="170" height="43" rx="21" fill="none" stroke="#7279bd"/><text x="1252" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="800" letter-spacing=".8" fill="#f3f4ff">DESCUBRIR <tspan fill="#a5f1e5">↗</tspan></text><line x1="92" y1="124" x2="1348" y2="124" stroke="#31344f"/>
<text x="98" y="222" font-family="Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="2.1" fill="#a5f1e5">✦ UN UNIVERSO POR EXPLORAR</text>
<text x="94" y="329" font-family="Arial,sans-serif" font-size="71" font-weight="700" letter-spacing="-3.8" fill="#f4f5ff">Más allá de</text><text x="94" y="407" font-family="Arial,sans-serif" font-size="71" font-weight="700" letter-spacing="-3.8" fill="#a7adff">lo conocido.</text>
<text x="99" y="458" font-family="Arial,sans-serif" font-size="15" fill="#bec2dc">Una experiencia visual para mirar el espacio</text><text x="99" y="482" font-family="Arial,sans-serif" font-size="15" fill="#bec2dc">con curiosidad y descubrir nuevos horizontes.</text>
<rect x="96" y="528" width="209" height="49" rx="24" fill="url(#accent)"/><text x="200" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="900" letter-spacing=".7" fill="#10142b">INICIAR EXPLORACIÓN</text><text x="333" y="558" font-family="Arial,sans-serif" font-size="10" font-weight="800" letter-spacing=".6" fill="#e5e7f7">CONOCER MÁS <tspan fill="#a5f1e5">↗</tspan></text>
<text x="98" y="676" font-family="Arial,sans-serif" font-size="9" font-weight="800" letter-spacing="1.4" fill="#7e86ab">UNA MIRADA DISTINTA HACIA EL COSMOS</text><line x1="98" y1="693" x2="282" y2="693" stroke="#717bd0"/>
